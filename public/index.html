<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DA Space</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#ffffff;
  --surface:#f6f7f9;
  --text:#1a1d21;
  --muted:#5b6470;
  --border:#e6e9ee;
  --brand:#1257d6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Pretendard',system-ui,-apple-system,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  padding:56px 24px;
}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:30px;font-weight:800;letter-spacing:-0.5px}
.sub{font-size:15px;color:var(--muted);margin-top:6px}
h2{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.desc{font-size:13px;color:var(--muted);margin-top:4px}
section{margin-bottom:40px}
.section-head{margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{
  display:block;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:14px;
  padding:26px 22px;
  cursor:pointer;
  transition:.15s;
  text-decoration:none;
  color:inherit;
}
.card:hover{border-color:var(--brand);box-shadow:0 4px 18px rgba(18,87,214,.10)}
.card h3{font-size:17px;font-weight:700;display:flex;align-items:center}
.card h3::after{content:"→";margin-left:auto;font-size:14px;opacity:.4}
.card p{font-size:13px;color:var(--muted);line-height:1.65;margin-top:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge{
  display:inline-block;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:7px;margin-top:12px;
}
.badge.free{background:#eef1f5;color:var(--muted)}
.badge.used{background:rgba(18,87,214,.08);color:var(--brand)}
.updated{
  font-size:13px;color:var(--muted);
  border-top:1px solid var(--border);
  margin-top:14px;padding-top:10px;
}
.status-msg{font-size:13px;color:var(--muted);margin-top:12px}
.status-msg.err{color:#c0392b}
</style>
</head>
<body>
<div class="wrap">

  <section>
    <div class="section-head">
      <h1>DA Space</h1>
      <p class="sub">부서원 누구나 자신의 HTML을 올려 공유할 수 있는 공간입니다. 빈방을 선택해 시작하세요.</p>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>방 목록</h2>
      <p class="desc">space.samsungda.net/A-1 형식으로 각 방에 바로 접속할 수 있습니다.</p>
    </div>
    <div class="grid" id="roomGrid"></div>
    <p class="status-msg" id="msg">불러오는 중…</p>
  </section>

</div>

<script>
(function(){
  var grid = document.getElementById('roomGrid');
  var msg = document.getElementById('msg');

  function esc(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render(rooms){
    grid.innerHTML = '';
    rooms.forEach(function (r) {
      var card = document.createElement('a');
      card.className = 'card';
      card.href = '/' + r.id;
      var badge = r.used
        ? '<span class="badge used">사용중</span>'
        : '<span class="badge free">빈방</span>';
      var body = r.used
        ? '<p>' + esc(r.title || '(제목 없음)') + '</p>' + badge
          + '<div class="updated">업데이트 ' + esc(r.updated) + '</div>'
        : '<p>비어 있는 공간입니다. 들어가서 HTML을 올려보세요.</p>' + badge;
      card.innerHTML = '<h3>' + r.id + '</h3>' + body;
      grid.appendChild(card);
    });
  }

  fetch('/api/rooms')
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data){
      render(data.rooms || []);
      msg.textContent = '';
    })
    .catch(function(e){
      msg.className = 'status-msg err';
      msg.textContent = '방 목록을 불러오지 못했습니다: ' + e.message;
    });
})();
</script>
</body>
</html>
