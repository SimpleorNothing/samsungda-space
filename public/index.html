<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Space</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#ffffff;
  --surface:#f6f7f9;
  --text:#1a1d21;
  --muted:#5b6470;
  --border:#e6e9ee;
  --brand:#1257d6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Pretendard',system-ui,-apple-system,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  padding:56px 24px;
}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:30px;font-weight:800;letter-spacing:-0.5px}
.sub{font-size:15px;color:var(--muted);margin-top:6px}
h2{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.desc{font-size:13px;color:var(--muted);margin-top:4px}
section{margin-bottom:40px}
.section-head{margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.divider{
  grid-column:1 / -1;
  display:flex;align-items:center;gap:12px;
  margin:6px 0;color:var(--muted);font-size:12px;font-weight:600;
}
.divider::before,.divider::after{content:"";flex:1;height:0;border-top:2px dashed var(--border)}
.grid.reorder .divider{color:var(--brand)}
.grid.reorder .divider::before,.grid.reorder .divider::after{border-top-color:var(--brand)}
.grid.reorder .card{cursor:grab}
.grid.reorder .card:active{cursor:grabbing}
.card.dragging{opacity:.45}
.grid.reorder .divider.drop-on{color:var(--brand)}
.grid.reorder .divider.drop-on::before,.grid.reorder .divider.drop-on::after{border-top-style:solid}
.card{
  display:block;
  min-width:0;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:14px;
  padding:26px 22px;
  cursor:pointer;
  transition:.15s;
  text-decoration:none;
  color:inherit;
}
.card:hover{border-color:var(--brand);box-shadow:0 4px 18px rgba(18,87,214,.10)}
.card.tinted{background:color-mix(in srgb, var(--c) 6%, #fff);border-color:color-mix(in srgb, var(--c) 30%, #fff)}
.card.tinted:hover{border-color:var(--c);box-shadow:0 4px 18px color-mix(in srgb, var(--c) 14%, transparent)}
.card.tinted h3{color:var(--c)}
.card.tinted .badge.used{background:color-mix(in srgb, var(--c) 10%, #fff);color:var(--c)}
.card.tinted .updated,.card.tinted .mgr{border-color:color-mix(in srgb, var(--c) 20%, #fff)}
.card h3{font-size:17px;font-weight:700;display:flex;align-items:center}
.card h3 .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;flex:none}
.card h3::after{content:"→";margin-left:auto;font-size:14px;opacity:.4}
.card p{font-size:13px;color:var(--muted);line-height:1.65;margin-top:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{
  display:inline-block;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:7px;
}
.badge.free{background:#eef1f5;color:var(--muted)}
.badge.used{background:rgba(18,87,214,.08);color:var(--brand)}
.badge.open{background:#eef1f5;color:var(--muted)}
.badge.lock{background:#fdecea;color:#c0392b}
.badge.exp{background:#eef1f5;color:var(--muted)}
.badge.expired{background:#fdecea;color:#c0392b}
.updated{
  font-size:13px;color:var(--muted);
  border-top:1px solid var(--border);
  margin-top:14px;padding-top:10px;
}
.mgr{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.mgr button{
  font-family:inherit;font-size:12px;font-weight:600;
  border:1.5px solid var(--border);border-radius:7px;background:#fff;color:var(--text);
  padding:5px 12px;cursor:pointer;transition:.15s;
}
.mgr button:hover{background:#ffe1e1;color:#c0392b;border-color:#ffe1e1}
.card.off{background:#eceef1;border-color:#e0e3e8}
.card.off h3{color:#9aa1ab}
.card.off h3::after{opacity:.3}
.card.off p{color:#aab0b9}
.card.off .badge.free,
.card.off .badge.open,
.card.off .badge.exp{background:#e2e5ea;color:#9aa1ab}
.card.off .updated,.card.off .mgr{border-color:#dfe2e7}
.card.off:hover{border-color:#c8cdd5;box-shadow:0 4px 18px rgba(90,100,115,.10)}
.card.off:hover h3::after{opacity:.55}
.card.on{
  background:radial-gradient(120% 90% at 50% 0%,
    rgba(255,214,120,.35) 0%,
    rgba(255,244,214,.55) 38%,
    #fffdf6 75%);
  border-color:#f2dfae;
  box-shadow:0 4px 22px rgba(255,176,46,.16);
}
.card.on h3{color:#8a5b00}
.card.on .badge.used{background:#ffedc2;color:#a06b00}
.card.on .updated{border-color:#f0e3bd}
.card.on .mgr{border-color:#f0e3bd}
.card.on:hover{border-color:#e9c463;box-shadow:0 6px 26px rgba(255,176,46,.24)}
.card.on.tinted{
  background:radial-gradient(120% 90% at 50% 0%,
    color-mix(in srgb, var(--c) 22%, #fff) 0%,
    color-mix(in srgb, var(--c) 10%, #fff) 38%,
    color-mix(in srgb, var(--c) 3%, #fff) 75%);
  border-color:color-mix(in srgb, var(--c) 35%, #fff);
  box-shadow:0 4px 22px color-mix(in srgb, var(--c) 18%, transparent);
}
.card.on.tinted h3{color:var(--c)}
.card.on.tinted .badge.used{background:color-mix(in srgb, var(--c) 12%, #fff);color:var(--c)}
.card.on.tinted .updated,.card.on.tinted .mgr{border-color:color-mix(in srgb, var(--c) 20%, #fff)}
.card.on.tinted:hover{border-color:var(--c);box-shadow:0 6px 26px color-mix(in srgb, var(--c) 26%, transparent)}
.card.off.tinted{
  background:color-mix(in srgb, var(--c) 8%, #fff);
  border-color:color-mix(in srgb, var(--c) 30%, #fff);
}
.card.off.tinted h3{color:var(--c)}
.card.off.tinted h3::after{opacity:.4}
.card.off.tinted p{color:color-mix(in srgb, var(--c) 45%, #5b6470)}
.card.off.tinted .badge.free,
.card.off.tinted .badge.open,
.card.off.tinted .badge.exp{background:color-mix(in srgb, var(--c) 12%, #fff);color:color-mix(in srgb, var(--c) 65%, #5b6470)}
.card.off.tinted .updated,.card.off.tinted .mgr{border-color:color-mix(in srgb, var(--c) 20%, #fff)}
.card.off.tinted:hover{border-color:var(--c);box-shadow:0 4px 18px color-mix(in srgb, var(--c) 14%, transparent)}
.status-msg{font-size:13px;color:var(--muted);margin-top:12px}
.status-msg.err{color:#c0392b}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head-btns{display:flex;gap:8px;flex:none}
.addbtn{font-family:inherit;font-size:13px;font-weight:600;
  border:1.5px solid var(--border);border-radius:7px;background:#eef1f5;color:var(--text);
  padding:9px 16px;cursor:pointer;transition:.15s;white-space:nowrap}
.addbtn:hover{border-color:var(--brand);color:var(--brand)}
.addbtn:disabled{opacity:.5;cursor:default}
.addbtn.on{border-color:var(--brand);color:var(--brand);background:rgba(18,87,214,.06)}
@media (max-width:600px){
  body{padding:32px 16px}
  h1{font-size:25px}
  .head-row{flex-wrap:wrap}
  .head-btns{width:100%}
  .head-btns .addbtn{flex:1}
}
</style>
</head>
<body>
<div class="wrap">

  <section>
    <div class="section-head">
      <h1>My Space</h1>
      <p class="sub">누구나 자신의 HTML을 빈방에 올려 공유하는 공간입니다.</p>
    </div>
  </section>

  <section>
    <div class="section-head head-row">
      <div>
        <h2>방 목록</h2>
        <p class="desc">space.samsungda.net/A-1 형식으로 각 방에 바로 접속할 수 있습니다.</p>
      </div>
      <div class="head-btns">
        <button class="addbtn" id="orderBtn" type="button">정렬</button>
        <button class="addbtn" id="mgrBtn" type="button">관리</button>
        <button class="addbtn" id="addRoomBtn" type="button">+ 빈방 추가</button>
      </div>
    </div>
    <div class="grid" id="roomGrid"></div>
    <p class="status-msg" id="msg">불러오는 중…</p>
  </section>

</div>

<script>
(function(){
  var grid = document.getElementById('roomGrid');
  var msg = document.getElementById('msg');
  var mgrBtn = document.getElementById('mgrBtn');
  var addBtn = document.getElementById('addRoomBtn');
  var orderBtn = document.getElementById('orderBtn');
  var roomsCache = [];
  var dividerPos = 0;
  var manage = false;
  var reorder = false;

  function esc(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function expBadge(r){
    if(!r.expiresAt) return '';
    if(r.expired) return '<span class="badge expired">기한 만료</span>';
    return '<span class="badge exp">~' + esc(r.expiresAt.slice(5)) + '</span>';
  }

  function descLine(r){
    if(r.published) return esc(r.title || '(제목 없음)');
    if(r.used) return '메모·파일이 저장되어 있습니다.';
    return '비어 있는 방입니다. 들어가서 바로 사용해보세요.';
  }

  function makeDivider(){
    var d = document.createElement('div');
    d.className = 'divider';
    d.dataset.divider = '1';
    d.textContent = '구분선';
    return d;
  }

  function makeCard(r){
    var card = document.createElement('a');
    card.className = 'card ' + (r.used ? 'on' : 'off');
    card.href = '/' + encodeURIComponent(r.id);
    card.dataset.id = r.id;

    var color = (r.color && /^#[0-9a-f]{6}$/i.test(r.color)) ? r.color : '';
    if(color){
      card.classList.add('tinted');
      card.style.setProperty('--c', color);
    }

    var badges = '<div class="badges">'
      + (r.used ? '<span class="badge used">사용중</span>' : '<span class="badge free">빈방</span>')
      + (r.locked ? '<span class="badge lock">비공개</span>' : '<span class="badge open">공개</span>')
      + expBadge(r)
      + '</div>';

    var dot = color ? '<span class="dot" style="background:' + color + '"></span>' : '';
    var html = '<h3>' + dot + esc(r.id) + '</h3>'
      + '<p>' + descLine(r) + '</p>'
      + badges
      + (r.published ? '<div class="updated">업데이트 ' + esc(r.updated) + '</div>' : '');
    card.innerHTML = html;

    if(reorder){
      card.draggable = true;
      card.addEventListener('click', function(e){ e.preventDefault(); });
      card.addEventListener('dragstart', onDragStart);
      card.addEventListener('dragend', onDragEnd);
    } else {
      card.draggable = false;
    }

    if(manage){
      var mgr = document.createElement('div');
      mgr.className = 'mgr';
      [['비우기', 'clear'], ['방 삭제', 'delete']].forEach(function(def){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = def[0];
        btn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          destroyRoom(r, def[1]);
        });
        mgr.appendChild(btn);
      });
      card.appendChild(mgr);
    }
    return card;
  }

  function render(){
    grid.innerHTML = '';
    grid.classList.toggle('reorder', reorder);
    var pos = Math.max(0, Math.min(dividerPos, roomsCache.length));
    roomsCache.forEach(function (r, i) {
      if(i === pos) grid.appendChild(makeDivider());
      grid.appendChild(makeCard(r));
    });
    if(pos >= roomsCache.length) grid.appendChild(makeDivider());
  }

  var dragId = null;

  function onDragStart(e){
    dragId = this.dataset.id;
    this.classList.add('dragging');
    if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch(_){} }
  }

  function onDragEnd(){
    dragId = null;
    grid.querySelectorAll('.dragging').forEach(function(el){ el.classList.remove('dragging'); });
    var d = grid.querySelector('.divider.drop-on');
    if(d) d.classList.remove('drop-on');
  }

  function afterTarget(x, y){
    var els = Array.prototype.slice.call(grid.querySelectorAll('.card:not(.dragging), .divider'));
    var best = null, bestDist = Infinity;
    els.forEach(function(el){
      var b = el.getBoundingClientRect();
      var cx = b.left + b.width / 2, cy = b.top + b.height / 2;
      var before = (y < cy - b.height / 2) || (Math.abs(y - cy) <= b.height / 2 && x < cx);
      if(!before) return;
      var dist = Math.hypot(x - cx, y - cy);
      if(dist < bestDist){ bestDist = dist; best = el; }
    });
    return best;
  }

  grid.addEventListener('dragover', function(e){
    if(!reorder || dragId === null) return;
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    var ref = afterTarget(e.clientX, e.clientY);
    var dragEl = grid.querySelector('.dragging');
    if(!dragEl) return;
    if(ref === dragEl) return;
    if(ref) grid.insertBefore(dragEl, ref);
    else grid.appendChild(dragEl);
    var div = grid.querySelector('.divider');
    grid.querySelectorAll('.divider').forEach(function(d){ d.classList.remove('drop-on'); });
    if(div && (ref === div || (dragEl.nextElementSibling === div) || (dragEl.previousElementSibling === div))) div.classList.add('drop-on');
  });

  grid.addEventListener('drop', function(e){
    if(!reorder || dragId === null) return;
    e.preventDefault();
    saveLayout();
  });

  function readLayout(){
    var order = [], pos = 0, sawDivider = false;
    Array.prototype.slice.call(grid.children).forEach(function(el){
      if(el.dataset.divider){ sawDivider = true; pos = order.length; }
      else if(el.dataset.id){ order.push(el.dataset.id); }
    });
    if(!sawDivider) pos = order.length;
    return { order: order, pos: pos };
  }

  function saveLayout(){
    var lay = readLayout();
    var byId = {};
    roomsCache.forEach(function(r){ byId[r.id] = r; });
    roomsCache = lay.order.map(function(id){ return byId[id]; }).filter(Boolean);
    dividerPos = lay.pos;
    fetch('/api/rooms', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ order: lay.order, dividerPos: lay.pos })
    }).then(function(r){
      if(r.ok){ msg.className = 'status-msg'; msg.textContent = ''; return; }
      msg.className = 'status-msg err';
      msg.textContent = '정렬 저장 실패 (HTTP ' + r.status + ')';
    }).catch(function(e){
      msg.className = 'status-msg err';
      msg.textContent = '정렬 저장 실패: ' + e.message;
    });
  }

  function destroyRoom(r, mode){
    var q = mode === 'clear'
      ? "'" + r.id + "' 방의 모든 데이터(메모·파일, 게시된 웹페이지, 설정)를 비울까요? 방 자체는 유지됩니다."
      : "'" + r.id + "' 방을 삭제할까요? 모든 데이터가 삭제되고 방 목록에서 사라집니다.\n(같은 이름으로 빈방을 다시 추가하면 방이 복구됩니다)";
    if(!window.confirm(q)) return;

    var headers = { 'content-type': 'application/json' };
    if(r.locked){
      var pw = window.prompt('비공개 방입니다. 비밀번호를 입력하세요.');
      if(pw === null) return;
      headers['x-room-password'] = pw;
    }
    msg.className = 'status-msg';
    msg.textContent = '처리 중…';
    fetch('/api/rooms', {
      method: 'DELETE',
      headers: headers,
      body: JSON.stringify({ id: r.id, mode: mode })
    }).then(function(res){
      if(res.ok){ loadRooms(); return; }
      msg.className = 'status-msg err';
      msg.textContent = res.status === 401 ? '비밀번호가 올바르지 않습니다.' : '처리 실패 (HTTP ' + res.status + ')';
    }).catch(function(e){
      msg.className = 'status-msg err';
      msg.textContent = '처리 실패: ' + e.message;
    });
  }

  function loadRooms(){
    fetch('/api/rooms')
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data){
        roomsCache = data.rooms || [];
        dividerPos = Number.isInteger(data.dividerPos) ? data.dividerPos : roomsCache.length;
        render();
        msg.className = 'status-msg';
        msg.textContent = '';
      })
      .catch(function(e){
        msg.className = 'status-msg err';
        msg.textContent = '방 목록을 불러오지 못했습니다: ' + e.message;
      });
  }

  mgrBtn.addEventListener('click', function(){
    manage = !manage;
    if(manage && reorder){ reorder = false; orderBtn.textContent = '정렬'; orderBtn.className = 'addbtn'; }
    mgrBtn.textContent = manage ? '관리 완료' : '관리';
    mgrBtn.className = manage ? 'addbtn on' : 'addbtn';
    render();
  });

  orderBtn.addEventListener('click', function(){
    reorder = !reorder;
    if(reorder && manage){ manage = false; mgrBtn.textContent = '관리'; mgrBtn.className = 'addbtn'; }
    orderBtn.textContent = reorder ? '정렬 완료' : '정렬';
    orderBtn.className = reorder ? 'addbtn on' : 'addbtn';
    msg.className = 'status-msg';
    msg.textContent = reorder ? '카드를 끌어 구분선 위·아래로 옮겨보세요. 변경은 자동 저장됩니다.' : '';
    render();
  });

  addBtn.addEventListener('click', function(){
    var name = (window.prompt('새 방 이름을 입력하세요. 이 이름이 주소가 됩니다.\n(영문·숫자·하이픈(-)·언더스코어(_), 최대 40자)') || '').trim();
    if(!name) return;
    if(!/^[A-Za-z0-9_-]{1,40}$/.test(name)){
      window.alert('이름에는 영문·숫자·하이픈(-)·언더스코어(_)만 쓸 수 있어요. (공백·한글·특수문자 불가)');
      return;
    }
    addBtn.disabled = true;
    fetch('/api/rooms', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: name })
    }).then(function(r){
      if(r.status === 201){ location.href = '/' + encodeURIComponent(name); return; }
      if(r.status === 409){ window.alert('이미 같은 이름의 방이 있어요.'); }
      else if(r.status === 400){ window.alert('사용할 수 없는 이름이에요.'); }
      else { window.alert('방 생성 실패 (HTTP ' + r.status + ')'); }
      addBtn.disabled = false;
    }).catch(function(e){ window.alert('방 생성 실패: ' + e.message); addBtn.disabled = false; });
  });

  loadRooms();
})();
</script>
<script defer src="/update-badge.js" data-src="/version.json"></script>
</body>
</html>
